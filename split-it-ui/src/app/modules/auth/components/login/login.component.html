<app-loading-spinner [isLoading]="isLoading"></app-loading-spinner>

<div class="auth-container">
    <mat-card class="auth-card" appearance="outlined">
      <mat-card-title class="auth-text">Login to your account</mat-card-title>
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="login($event)">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="example@example.com" required aria-required="true" />
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required.</mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email') && !loginForm.get('email')?.hasError('required')">Enter a valid email address.</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password" required aria-required="true" />
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required.</mat-error>
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 6 characters.</mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" class="full-width" type="submit">Login now</button>
        </form>
      </mat-card-content>
      <mat-card-actions align="end">
        <span class="auth-action-text">Don't have an account? <a routerLink="/auth/register" class="auth-link">Create account</a></span>
      </mat-card-actions>
    </mat-card>
  </div>
