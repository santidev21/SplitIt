<mat-card class="group-card" [routerLink]="['/dashboard/group', group.id]" appearance="outlined" tabindex="0" role="link" [attr.aria-label]="'Open group ' + group.name">
    <mat-card-header>
      <mat-card-title>{{group.name}}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>{{group.description}}</p>
    </mat-card-content>
  </mat-card>
