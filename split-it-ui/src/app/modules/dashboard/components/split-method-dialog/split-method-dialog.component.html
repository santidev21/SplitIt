<h2 mat-dialog-title class="heading-xl text-center">Split Expense</h2>

<mat-dialog-content>
  <mat-tab-group [(selectedIndex)]="selectedTabIndex" (selectedTabChange)="onTabChange($event.index)">
    <mat-tab label="Equally">
      <div class="tab-content">
        <mat-checkbox *ngFor="let member of members" [(ngModel)]="equalSplitSelection[member.id]"
                      [attr.aria-label]="'Include ' + member.name + ' in equal split'">
          {{ member.name }}
        </mat-checkbox>
      </div>
    </mat-tab>

    <mat-tab label="By Amount">
      <div class="tab-content">
        <div *ngFor="let member of members" class="split-input-row">
            <span class="member-name">{{ member.name }}</span>
            <mat-form-field class="member-input" appearance="fill">
              <mat-label>Amount for {{ member.name }}</mat-label>
              <input matInput type="number" [(ngModel)]="member.amount" appPositiveNumber/>
            </mat-form-field>
          </div>
      </div>
    </mat-tab>

    <mat-tab label="By Percentage">
      <div class="tab-content">
        <div *ngFor="let member of members" class="split-input-row">
            <span class="member-name">{{ member.name }}</span>
            <mat-form-field class="member-input" appearance="fill">
              <mat-label>Percentage for {{ member.name }}</mat-label>
              <input matInput type="number" [(ngModel)]="member.amount" appPercentage/>
            </mat-form-field>
          </div>
      </div>
    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<div class="split-error-banner" *ngIf="validationError" role="alert">
  <mat-icon color="warn">error_outline</mat-icon>
  <span>{{ validationError }}</span>
</div>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="confirmSplit()" aria-label="Confirm split method">Done</button>
</mat-dialog-actions>
