name: splitit

services:
  sqlserver:
    container_name: splitit-db
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Uses official default user (mssql, UID 10001). On Docker Desktop Windows, override with user: "0:0" in docker-compose.override.yml.
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    networks:
      - splitit-backend-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 2048M

  db-init:
    container_name: splitit-db-init
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_APP_USER=${DB_APP_USER:-splitit_app}
      - MSSQL_APP_PASSWORD=${DB_APP_PASSWORD:-${DB_PASSWORD}}
      - MSSQL_MIGRATOR_USER=${DB_MIGRATOR_USER:-splitit_migrator}
      - MSSQL_MIGRATOR_PASSWORD=${DB_MIGRATOR_PASSWORD:-${DB_PASSWORD}}
    networks:
      - splitit-backend-net
    volumes:
      - ./docker/sqlserver/init-db-users.sh:/usr/src/init-db-users.sh:ro
    entrypoint: ["/bin/bash", "/usr/src/init-db-users.sh"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  migrator:
    container_name: splitit-migrator
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SplitItDb;User Id=${DB_MIGRATOR_USER:-splitit_migrator};Password=${DB_MIGRATOR_PASSWORD:-${DB_PASSWORD}};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationInMinutes=${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      - JwtSettings__RefreshTokenExpirationInDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-30}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
    networks:
      - splitit-frontend-net
      - splitit-backend-net
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    entrypoint: ["dotnet", "SplitIt.API.dll", "--migrate"]
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  backend:
    container_name: splitit-backend
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=SplitItDb;User Id=${DB_APP_USER:-splitit_app};Password=${DB_APP_PASSWORD:-${DB_PASSWORD}};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins=${CORS_ALLOWED_ORIGINS}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - AllowedHosts=*
    volumes:
      - dataprotection_keys:/home/app/.aspnet/DataProtection-Keys
    networks:
      - splitit-frontend-net
      - splitit-backend-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  frontend:
    container_name: splitit-frontend
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Port 80 is intentionally NOT published. Only the reverse proxy accesses this container.
    networks:
      - splitit-frontend-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M

  proxy:
    container_name: splitit-proxy
    build:
      context: .
      dockerfile: docker/proxy/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - TLS_MODE=${TLS_MODE:-selfsigned}
      - ACME_EMAIL=${ACME_EMAIL:-}
      - BACKEND_HOST=backend
      - FRONTEND_HOST=frontend
      - HTTP_LISTEN_PORT=8080
      - HTTPS_LISTEN_PORT=8443
    volumes:
      - nginx_certs:/etc/nginx/ssl
      - /opt/gateway/certbot:/etc/letsencrypt:ro
      - /opt/gateway/sites-enabled:/etc/nginx/sites-enabled:ro
      - /opt/gateway/www:/var/www/certbot
    networks:
      - splitit-frontend-net
      - splitit-backend-net
      - portfolio_default
      - billard-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

networks:
  splitit-frontend-net:
    name: splitit-frontend-net
    external: true
  splitit-backend-net:
    name: splitit-backend-net
    driver: bridge
    internal: true
  portfolio_default:
    name: portfolio_default
    external: true
  billard-net:
    name: billard-net
    external: true

volumes:
  sqlserver_data:
    name: splitit_sqlserver_data
  dataprotection_keys:
    name: splitit_dataprotection_keys
  nginx_certs:
    name: splitit_nginx_certs
