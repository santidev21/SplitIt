# Dependabot configuration for SplitIt.
# Keeps NuGet, npm, GitHub Actions and Docker base images up to date and surfaces
# known vulnerabilities as security alerts/PRs.
version: 2
updates:
  # .NET backend (solution lives in SplitIt.API, tests in SplitIt.Tests).
  - package-ecosystem: "nuget"
    directory: "/SplitIt.API"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directory: "/SplitIt.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Node tooling: root orchestration package and the Angular app.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/split-it-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Workflow actions and Docker base images.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/docker/backend"
      - "/docker/frontend"
      - "/docker/proxy"
    schedule:
      interval: "weekly"
