name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      CI_MSSQL_SA_PASSWORD: Strong_Passw0rd123!
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD || 'Strong_Passw0rd123!' }}
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ secrets.CI_MSSQL_SA_PASSWORD || 'Strong_Passw0rd123!' }}' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${{ secrets.CI_MSSQL_SA_PASSWORD || 'Strong_Passw0rd123!' }}' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore SplitIt.API/SplitIt.Back.sln

      - name: Build
        run: dotnet build SplitIt.API/SplitIt.Back.sln --no-restore -c Release

      - name: Run backend tests
        run: dotnet test SplitIt.API/SplitIt.Back.sln --no-build -c Release --logger "trx;LogFileName=backend-results.trx" --collect:"XPlat Code Coverage" --settings coverlet.runsettings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: "**/coverage.cobertura.xml"
          retention-days: 7

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: split-it-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefix split-it-ui

      - name: Build Angular (production)
        run: npm run build --prefix split-it-ui -- --configuration production

      - name: Run unit tests with coverage
        run: npm run test:ci --prefix split-it-ui

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: split-it-ui/coverage/
          retention-days: 7

  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: split-it-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefix split-it-ui

      - name: Build Angular (production)
        run: npm run build --prefix split-it-ui -- --configuration production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium --prefix split-it-ui

      - name: Run Playwright tests
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: split-it-ui/playwright-report/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          if grep -rn --include="*.cs" --include="*.ts" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" -E "(password|secret|api[_-]?key|token)\s*[:=]\s*['\"][^'\"]{8,}" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=bin --exclude-dir=obj --exclude-dir=coverage . 2>/dev/null; then
            echo "Potential secrets found. Review above."
            exit 1
          fi
          echo "No obvious secrets found in code."

      - name: Check .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked by git!"
            exit 1
          fi
          echo ".env is not tracked by git."

      - name: Validate .gitignore excludes secrets
        run: |
          grep -q "^\.env$" .gitignore || { echo ".gitignore does not exclude .env"; exit 1; }
          grep -q "\.env\.\*\.local" .gitignore || { echo ".gitignore does not exclude .env.*.local"; exit 1; }
          echo ".gitignore properly excludes secret files."

      - name: Validate .dockerignore excludes secrets
        run: |
          grep -q "^\.env$" .dockerignore || { echo ".dockerignore does not exclude .env"; exit 1; }
          grep -q "\.env\.\*" .dockerignore || { echo ".dockerignore does not exclude .env.*"; exit 1; }
          echo ".dockerignore properly excludes secret files."

  docker-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: splitit-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: splitit-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: splitit-backend:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: splitit-frontend:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          docker compose config --quiet
          echo "docker-compose.yml is valid."
