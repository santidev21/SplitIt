# Internal static file server for the SplitIt Angular SPA.
# This container is NOT exposed to the host; only the reverse proxy reaches it.
server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy handles all security headers; do not duplicate them here.

    # Gzip compression for static performance.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Local-only API proxy. In production the gateway routes /api/* to the backend
    # directly, so this only takes effect when the frontend is accessed standalone
    # (e.g. `docker compose -f docker-compose.yml -f docker-compose.local.yml up`).
    location /api/ {
        proxy_pass http://splitit-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Caching policy for hashed static assets.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Angular SPA HTML5 history routing — catch-all last.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
