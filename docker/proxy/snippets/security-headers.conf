# Production security headers for the SplitIt reverse proxy.
# Headers are added at the proxy layer so they apply to both the SPA and proxied API responses.

# Enforce HTTPS for one year (including subdomains). Preload is opt-in via browser lists.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Allow framing only by the same origin.
add_header X-Frame-Options "SAMEORIGIN" always;

# Referrer policy: only send origin on cross-origin, full URL on same-origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser features not used by SplitIt.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Cross-Origin policies compatible with a same-origin SPA + API architecture.
# 'same-origin-allow-popups' lets the Google OAuth popup keep its opener reference
# (needed for the GIS popup flow to postMessage the credential back).
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Content Security Policy for Angular production build.
# Note: style-src includes 'unsafe-inline' because Angular Material and Bootstrap may inject
# small inline style blocks at runtime. The application does NOT use inline scripts, so
# script-src remains strict ('self').
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://accounts.google.com https://accounts.google.com/gsi; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
