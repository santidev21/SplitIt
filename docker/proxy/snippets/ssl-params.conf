# TLS hardening for SplitIt production proxy.
# TLS 1.2 and 1.3 only. Obsolete protocols and insecure ciphers disabled.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers on;

# Cipher suite: strong, forward-secret, no CBC/RC4/3DES/MD5/SHA1.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:50m;
ssl_session_tickets off;

# OCSP stapling (requires Nginx to reach the CA; harmless if unreachable).
ssl_stapling on;
ssl_stapling_verify on;

# Diffie-Hellman parameter for DHE ciphers. Expected to be mounted at runtime.
# Generate with: openssl dhparam -out dhparam.pem 2048
ssl_dhparam /etc/nginx/ssl/dhparam.pem;
