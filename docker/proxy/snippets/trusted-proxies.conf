# Optional trusted proxy/CIDR list for real_ip handling.
# This file is included by nginx.conf but is expected to be mounted read-only at runtime.
# Example for Cloudflare:
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# ...
# By default only RFC1918 ranges are trusted (configured in nginx.conf).
