# Local development — run with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# This file:
# - Redefines shared networks as local bridges (no external dependency)
# - Publishes debug ports to localhost
# - Applies Docker Desktop Windows fixes

services:
  sqlserver:
    user: "0:0"  # Docker Desktop Windows: mssql image requires root for named volumes
    ports:
      - "127.0.0.1:1433:1433"  # loopback only: reachable from `dotnet run`, never external

  backend:
    ports:
      - "127.0.0.1:8090:8080"  # host 8090: avoids clash with Bikontrol API (8080); container still listens on 8080

  frontend:
    ports:
      - "127.0.0.1:80:80"

networks:
  splitit-net:
    name: splitit-net
    driver: bridge
    external: false
  splitit-internal-net:
    name: splitit-internal-net
    driver: bridge
